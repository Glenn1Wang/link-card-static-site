<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      id="meta-description"
      name="description"
      content="选择开户银行，进入广发证券开户注册页面"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#202124" />
    <title>选择开户银行</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero" aria-labelledby="page-title">
        <div class="hero-content">
          <p id="page-label" class="brand-lockup">
            <span class="brand-rule" aria-hidden="true"></span>
            <span id="page-label-text">广发证券开户服务</span>
          </p>

          <div class="hero-copy">
            <h1 id="page-title">选择开户银行</h1>
            <p id="page-description" class="page-description">
              选择银行后，将进入广发证券开户注册页面
            </p>
          </div>
        </div>

      </header>

      <section class="bank-picker" aria-labelledby="bank-picker-title">
        <h2 id="bank-picker-title" class="sr-only">可选银行</h2>
        <p id="page-status" class="page-status" role="status">正在加载银行…</p>

        <ul id="bank-list" class="bank-list" aria-busy="true">
          <li class="skeleton" aria-hidden="true"></li>
          <li class="skeleton" aria-hidden="true"></li>
          <li class="skeleton" aria-hidden="true"></li>
          <li class="skeleton" aria-hidden="true"></li>
          <li class="skeleton" aria-hidden="true"></li>
          <li class="skeleton" aria-hidden="true"></li>
          <li class="skeleton" aria-hidden="true"></li>
          <li class="skeleton" aria-hidden="true"></li>
          <li class="skeleton" aria-hidden="true"></li>
          <li class="skeleton" aria-hidden="true"></li>
        </ul>

        <div id="empty-state" class="state-message" role="status" hidden>
          暂无可选银行
        </div>

        <div id="error-state" class="state-message state-message--error" role="alert" hidden>
          <strong>银行列表加载失败</strong>
          <span>请检查网络后重新加载</span>
          <button id="retry-button" class="retry-button" type="button">重新加载</button>
        </div>
      </section>
    </main>

    <template id="bank-template">
      <li class="bank-item">
        <a class="bank-link">
          <strong class="bank-name"></strong>
          <span class="bank-arrow" aria-hidden="true">
            <svg viewBox="0 0 20 20" focusable="false">
              <path d="M4 10h11m-4-4 4 4-4 4" />
            </svg>
          </span>
          <span class="new-tab-label sr-only" hidden>在新标签页打开</span>
        </a>
      </li>
    </template>

    <noscript>
      <p class="noscript-message">请启用 JavaScript 后继续。</p>
    </noscript>
  </body>
</html>
